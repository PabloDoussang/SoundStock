{% if items.paginator.num_pages > 1 %}<nav class="pagination-bar" aria-label="Páginas de resultados">{% if items.has_previous %}<a target="_self" class="btn secondary" href="{% querystring page=items.previous_page_number %}">← Anterior</a>{% endif %}<span>Página {{ items.number }} de {{ items.paginator.num_pages }}</span>{% if items.has_next %}<a target="_self" class="btn secondary" href="{% querystring page=items.next_page_number %}">Siguiente →</a>{% endif %}</nav>{% endif %}
