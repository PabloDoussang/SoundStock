{% extends 'base.html' %}{% block contenido %}<div class="encabezado"><div><p class="etiqueta">ORGANIZACIÓN FÍSICA</p><h1>Ubicaciones</h1></div></div>
<section class="panel"><form method="get" class="filtros"><input name="q" placeholder="Buscar ubicación o producto" value="{{ request.GET.q }}"><button>Buscar</button><a href="{% url 'ubicaciones' %}">Limpiar</a></form>
<div class="tabla"><table><thead><tr><th>Ubicación</th><th>Productos</th><th>Unidades</th></tr></thead><tbody>
{% for lugar in pagina %}<tr><td>{{ lugar.ubicacion }}</td><td>{{ lugar.productos }}</td><td>{{ lugar.unidades }}</td></tr>{% empty %}<tr><td colspan="3">No hay ubicaciones.</td></tr>{% endfor %}</tbody></table></div>
{% include 'paginacion.html' %}</section>{% endblock %}
